  <!-- Dashboard grid -->
  <rect x="15" y="15" width="25" height="15" rx="2" fill="white" opacity="0.9"/>
  <rect x="45" y="15" width="40" height="15" rx="2" fill="white" opacity="0.7"/>
  
  <rect x="15" y="35" width="40" height="20" rx="2" fill="white" opacity="0.8"/>
  <rect x="60" y="35" width="25" height="20" rx="2" fill="white" opacity="0.6"/>
  
  <rect x="15" y="60" width="25" height="25" rx="2" fill="white" opacity="0.7"/>
